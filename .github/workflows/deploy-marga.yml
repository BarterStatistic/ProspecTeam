name: Deploy Marga to GitHub Pages

# Builds the Marga app (marga/) and publishes it to GitHub Pages. Enabling this
# makes the repository's Pages site serve Marga.
on:
  push:
    branches: [master]
    paths:
      - 'marga/**'
      - '.github/workflows/deploy-marga.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: marga/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: marga
      - name: Build
        run: npm run build
        working-directory: marga
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: marga/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
