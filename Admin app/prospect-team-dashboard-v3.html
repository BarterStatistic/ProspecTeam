          <Input label="Constancia" type="number" min={0} value={g.gastoConstancia} onChange={v => upd('gastoConstancia', v)} suffix="$"
                 info="Costo del trámite de constancia o factura por moto." />
        </div>
        <div className="text-xs mt-2" style={{ color: C.textMuted }}>
          Total operativo: <span className="pt-display" style={{ color: C.gold }}>{fmt.money(gastoOp)}</span>
        </div>
      </div>

      <div className="mt-5 p-4 rounded-xl" style={{ background: C.goldFaint, border: `1px solid ${C.goldBorder}` }}>
        <div className="flex justify-between items-center">
          <span className="pt-display text-sm" style={{ color: C.text }}>Total gastos</span>
          <span className="pt-display text-xl pt-grad-text">{fmt.money(gastoPub + gastoOp)}</span>
        </div>
      </div>
    </Modal>
  );
}

function RetrosView({ data, setData }) {
  const [vendedor, setVendedor] = useState(data.vendedores[0]);
  const [adding, setAdding] = useState(false);
  const [draft, setDraft] = useState({ date: new Date().toISOString().slice(0, 10), nivel: 'bueno', comentario: '' });

  const ventasVendedor = useMemo(() => data.ventas.filter(v => v.vendedor === vendedor), [data.ventas, vendedor]);
  const prospectosVendedor = useMemo(() =>
    data.prospectos.filter(p => p.vendedor === vendedor).reduce((s, p) => s + p.cantidad, 0), [data.prospectos, vendedor]);
  const exito = prospectosVendedor > 0 ? ventasVendedor.length / prospectosVendedor : 0;
  const retros = data.retros[vendedor] || [];

  const addRetro = () => {
    if (!draft.comentario.trim()) return;
    setData(d => ({
      ...d,
      retros: { ...d.retros, [vendedor]: [...(d.retros[vendedor] || []), { ...draft, id: Date.now() }] }
    }));
    setDraft({ date: new Date().toISOString().slice(0, 10), nivel: 'bueno', comentario: '' });
    setAdding(false);
  };

  const removeRetro = (id) => {
    setData(d => ({
      ...d,
      retros: { ...d.retros, [vendedor]: (d.retros[vendedor] || []).filter(r => r.id !== id) }
    }));
  };

  // Determine current level based on success rate
  const nivelSugerido = exito >= 0.30 ? 'excelente' : exito >= 0.20 ? 'bueno' : exito >= 0.12 ? 'regular' : exito > 0 ? 'bajo' : 'critico';
  const nivelData = NIVELES_RENDIMIENTO.find(n => n.value === nivelSugerido);

  return (
    <div className="pt-fade-in">
      <SectionHeader title="Retros" subtitle="Niveles de rendimiento y feedback por vendedor"
                     info="Sistema de evaluación y feedback. El nivel se sugiere automáticamente según el % de éxito del vendedor, pero puedes registrar comentarios manuales." />

      <div className="flex flex-wrap gap-2 mb-5">
        {data.vendedores.map(v => (
          <button key={v} onClick={() => setVendedor(v)}
                  className={`px-4 py-2 rounded-lg text-sm transition`}
                  style={{
                    background: vendedor === v ? C.goldFaint : 'transparent',
                    color: vendedor === v ? C.gold : C.textMuted,
                    border: `1px solid ${vendedor === v ? C.goldBorder : C.border}`
                  }}>
            {v}
          </button>
        ))}
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
        <Card className="p-5 lg:col-span-2">
          <div className="flex items-center justify-between mb-4">
            <h3 className="pt-display text-lg" style={{ color: C.text }}>{vendedor}</h3>
            <div className="px-3 py-1 rounded text-xs uppercase tracking-wider"
                 style={{ background: `${nivelData.color}15`, color: nivelData.color, border: `1px solid ${nivelData.color}40` }}>
              {nivelData.label}
            </div>
          </div>

          <div className="grid grid-cols-3 gap-4">
            <div className="text-center">
              <div className="text-[10px] uppercase tracking-wider mb-1" style={{ color: C.textMuted }}>Ventas</div>
              <div className="pt-display text-3xl pt-grad-text">{ventasVendedor.length}</div>
            </div>
            <div className="text-center">

// ============================================================================
// ADMIN VIEW — Vista directa de todas las tablas SQL (solo perfil ADMIN)
// ============================================================================
function AdminView({ db }) {
  const [activeTable, setActiveTable] = useState('ventas');
  const [queryText, setQueryText] = useState('');
  const [queryResult, setQueryResult] = useState(null);
  const [queryError, setQueryError] = useState('');
  const [queryTime, setQueryTime] = useState(null);

  const TABLES = ['usuarios','vendedores','promotores','modelos_moto','ventas','prospectos',
                  'metas_mensuales','historico_global','retroalimentaciones','gastos','guardias_config'];

  const tableData = useMemo(() => {
    if (!db) return { columns: [], rows: [] };
    try {
      const r = db.exec(`SELECT * FROM ${activeTable} LIMIT 500`);
      return r[0] ? { columns: r[0].columns, rows: r[0].values } : { columns: [], rows: [] };
    } catch (e) { return { columns: [], rows: [], error: e.message }; }
  }, [db, activeTable]);

  const rowCount = useMemo(() => {
    if (!db) return 0;
    try { return db.exec(`SELECT COUNT(*) FROM ${activeTable}`)[0]?.values[0]?.[0] || 0; }
    catch (_) { return 0; }
  }, [db, activeTable]);

  const runQuery = () => {
    if (!db || !queryText.trim()) return;
    const t0 = Date.now();
    try {
      const result = db.exec(queryText);
      setQueryTime(Date.now() - t0);
      setQueryResult(result);
      setQueryError('');
    } catch (e) { setQueryError(e.message); setQueryResult(null); setQueryTime(null); }
  };

  if (!db) {
    return (
      <div className="pt-fade-in flex items-center justify-center min-h-[300px]">
        <div className="text-sm" style={{ color: C.textDim }}>Inicializando base de datos…</div>
      </div>
    );
  }

  return (
    <div className="pt-fade-in">
      <SectionHeader
        title="Base de Datos"
        subtitle="Vista y consulta directa de todas las tablas SQL · Solo perfil ADMIN"
        info="Acceso completo al esquema relacional SQLite. Puedes inspeccionar cualquier tabla o ejecutar consultas SQL personalizadas (Ctrl+Enter para ejecutar)."
      />

      {/* Selector de tabla */}
      <div className="flex flex-wrap gap-2 mb-4">
        {TABLES.map(t => (
          <button key={t} onClick={() => setActiveTable(t)}
                  className="px-3 py-1.5 rounded-lg text-[11px] font-mono uppercase tracking-wide transition"
                  style={{
                    background: activeTable === t ? C.goldFaint : 'rgba(255,255,255,0.025)',
                    color: activeTable === t ? C.gold : C.textMuted,
                    border: `1px solid ${activeTable === t ? C.goldBorder : C.borderStrong}`
                  }}>
            {t}
          </button>
        ))}
      </div>

      {/* Tabla de datos */}
      <Card className="p-0 mb-6">
        <div className="flex items-center gap-3 px-5 py-3 border-b" style={{ borderColor: C.border }}>
          <Database size={14} style={{ color: C.gold }} />
          <span className="pt-display text-sm" style={{ color: C.gold }}>{activeTable}</span>
          <span className="text-[11px] px-2 py-0.5 rounded font-mono"
                style={{ background: C.goldFaint, color: C.gold }}>
            {rowCount} {rowCount === 1 ? 'fila' : 'filas'}
          </span>
        </div>
        <div className="overflow-x-auto pt-scroll" style={{ maxHeight: 420 }}>
          {tableData.error ? (
            <div className="p-5 text-sm" style={{ color: C.danger }}>{tableData.error}</div>
          ) : tableData.columns.length === 0 ? (
            <div className="p-12 text-center text-sm" style={{ color: C.textDim }}>
              Tabla vacía
            </div>
          ) : (
            <table className="w-full text-xs">
              <thead className="sticky top-0">
                <tr>
                  {tableData.columns.map(col => (
                    <th key={col} className="px-4 py-2.5 text-left font-medium font-mono text-[11px] tracking-wider whitespace-nowrap"
                        style={{ color: C.textMuted, background: C.bgCard, borderBottom: `1px solid ${C.border}` }}>
                      {col}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {tableData.rows.map((row, i) => (
                  <tr key={i} className="border-t hover:bg-white/[0.015] transition"
                      style={{ borderColor: C.border }}>
                    {row.map((cell, j) => (
                      <td key={j} className="px-4 py-2 font-mono whitespace-nowrap"
                          style={{
                            color: cell === null ? C.textDim : C.text,
                            maxWidth: 280, overflow: 'hidden', textOverflow: 'ellipsis',
                            display: 'table-cell'
                          }}>
                        {cell === null ? <span style={{ color: C.textDim, fontStyle: 'italic' }}>NULL</span>
                          : String(cell).length > 100
                            ? String(cell).substring(0, 97) + '…'
                            : String(cell)}
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </Card>

      {/* Editor de consulta SQL */}
      <Card className="p-5">
        <div className="flex items-center gap-3 mb-3">
          <span className="text-xs uppercase tracking-wider" style={{ color: C.textMuted }}>
            Consulta SQL personalizada
          </span>
          {queryTime !== null && (
            <span className="text-[11px] px-2 py-0.5 rounded"
                  style={{ background: 'rgba(74,222,128,0.1)', color: C.success }}>
              {queryTime}ms
            </span>
          )}
        </div>
        <textarea
          value={queryText}
          onChange={e => setQueryText(e.target.value)}
          onKeyDown={e => { if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); runQuery(); } }}
          className="pt-input w-full rounded-lg p-3 mb-3 font-mono resize-none"
          style={{ fontSize: 12, height: 88, lineHeight: 1.5 }}
          placeholder="SELECT v.vendedor, COUNT(*) as ventas FROM ventas v GROUP BY v.vendedor ORDER BY ventas DESC;"
        />
        <div className="flex items-center gap-2">
          <Button onClick={runQuery} disabled={!queryText.trim()}>
            Ejecutar <span className="text-[10px] opacity-50 ml-1">Ctrl+Enter</span>
          </Button>
          <Button variant="ghost" size="sm" onClick={() => { setQueryText(''); setQueryResult(null); setQueryError(''); setQueryTime(null); }}>
            Limpiar
          </Button>
        </div>

        {queryError && (
          <div className="mt-3 p-3 rounded-lg text-xs font-mono"
               style={{ background: 'rgba(248,113,113,0.08)', border: '1px solid rgba(248,113,113,0.25)', color: C.danger }}>
            {queryError}
          </div>
        )}

        {queryResult && queryResult.length > 0 && queryResult[0] && (
          <div className="mt-4">
            <div className="text-xs mb-2" style={{ color: C.textMuted }}>
              {queryResult[0].values.length} {queryResult[0].values.length === 1 ? 'resultado' : 'resultados'}
            </div>
            <div className="overflow-x-auto pt-scroll rounded-xl" style={{ border: `1px solid ${C.border}`, maxHeight: 320 }}>
              <table className="w-full text-xs">
                <thead className="sticky top-0">
                  <tr>
                    {queryResult[0].columns.map(col => (
                      <th key={col} className="px-4 py-2.5 text-left font-mono text-[11px]"
                          style={{ color: C.textMuted, background: C.bgCard, borderBottom: `1px solid ${C.border}` }}>
                        {col}
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {queryResult[0].values.slice(0, 200).map((row, i) => (
                    <tr key={i} style={{ borderTop: `1px solid ${C.border}` }}>
                      {row.map((cell, j) => (
                        <td key={j} className="px-4 py-2 font-mono whitespace-nowrap"
                            style={{ color: cell === null ? C.textDim : C.text }}>
                          {cell === null ? <span style={{ fontStyle: 'italic' }}>NULL</span> : String(cell).substring(0, 200)}
                        </td>
                      ))}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            {queryResult[0].values.length > 200 && (
              <p className="text-xs mt-2" style={{ color: C.textDim }}>
                Mostrando primeros 200 de {queryResult[0].values.length} resultados
              </p>
            )}
          </div>
        )}

        {queryResult && queryResult.length === 0 && (
          <div className="mt-3 flex items-center gap-2 text-xs"
               style={{ color: C.success }}>
            <CheckCircle2 size={13} /> Comando ejecutado correctamente (sin filas devueltas)
          </div>
        )}
      </Card>
    </div>
  );
}

const NAV_ITEMS = [

  { id: 'guardias', label: 'Guardias', icon: Calendar },
  { id: 'metricos', label: 'Métricos de venta', icon: BarChart3 },
  { id: 'comisiones', label: 'Comisiones', icon: DollarSign },
  { id: 'pagos', label: 'Pagos', icon: CreditCard },
  { id: 'financiero', label: 'Financiero', icon: TrendingUp },
  { id: 'retros', label: 'Retros', icon: MessageSquare }
];

function MainApp({ onLogout, isAdmin }) {
  const [data, setData] = useState(DEFAULT_DATA);
  const [loaded, setLoaded] = useState(false);
  const [active, setActive] = useState('dashboard');
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  const [db, setDb] = useState(null);
  const [dbError, setDbError] = useState('');

  useEffect(() => {
    // DB ya fue inicializada en App; solo leer datos
    try {
      setDb(DB);
      setData(dbToAppData());
    } catch (e) {
      console.error('DB load en MainApp:', e);
      setDbError(e.message);
      setData(DEFAULT_DATA);
    }
    setLoaded(true);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  useEffect(() => {
    if (loaded && DB) appDataToDB(data);
  }, [data, loaded]);

  const renderView = () => {
    switch (active) {
      case 'dashboard':  return <DashboardView data={data} />;
      case 'guardias':   return <GuardiasView data={data} setData={setData} />;
      case 'metricos':   return <MetricosView data={data} setData={setData} />;
      case 'comisiones': return <ComisionesView data={data} setData={setData} />;
      case 'pagos':      return <PagosView data={data} setData={setData} />;
      case 'financiero': return <FinancieroView data={data} setData={setData} />;
      case 'retros':     return <RetrosView data={data} setData={setData} />;
      case 'admin':      return isAdmin ? <AdminView db={db} /> : null;
      default: return null;
    }
  };

  if (!loaded) {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center pt-body" style={{ background: C.bg }}>
        <div className="pt-display tracking-[0.3em] text-sm mb-2" style={{ color: C.gold }}>CARGANDO…</div>
        <div className="text-xs" style={{ color: C.textDim }}>Inicializando base de datos SQL</div>
      </div>
    );
  }

  return (
    <div className="min-h-screen flex pt-body" style={{ background: C.bg, color: C.text }}>
      {/* Sidebar */}
      <aside className={`fixed lg:sticky top-0 left-0 h-screen w-64 flex flex-col z-40 transition-transform ${mobileNavOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'}`}
             style={{ background: C.bgCard, borderRight: `1px solid ${C.border}` }}>
        <div className="p-5 border-b" style={{ borderColor: C.border }}>
          <div className="flex items-center gap-3">
            <img src={LOGO_PT} alt="Prospect Team" className="w-10 h-10 object-contain rounded-lg"
                 style={{ filter: 'drop-shadow(0 4px 12px rgba(212,162,76,0.25))' }} />
            <div>
              <div className="pt-display text-sm pt-grad-text font-semibold">PROSPECT TEAM</div>
              <div className="text-[10px] uppercase tracking-[0.2em]" style={{ color: C.textDim }}>Admin · Dinamo</div>
            </div>
          </div>
        </div>

        <nav className="flex-1 p-3 pt-scroll overflow-y-auto">
          {NAV_ITEMS.map(item => {
            const Icon = item.icon;
            const isActive = active === item.id;
            return (
              <button key={item.id}
                      onClick={() => { setActive(item.id); setMobileNavOpen(false); }}
                      className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm mb-1 transition relative ${isActive ? 'pt-shine' : ''}`}
                      style={{
                        background: isActive ? C.goldFaint : 'transparent',
                        color: isActive ? C.gold : C.textMuted,
                        border: `1px solid ${isActive ? C.goldBorder : 'transparent'}`
                      }}>
                <Icon size={16} />
                <span>{item.label}</span>
                {isActive && <span className="absolute right-3 w-1.5 h-1.5 rounded-full" style={{ background: C.gold, boxShadow: `0 0 8px ${C.gold}` }}></span>}
              </button>
            );
          })}

        </nav>

        <div className="p-3 border-t" style={{ borderColor: C.border }}>
          {/* Pestaña Base de datos — solo perfil ADMIN, en el footer para siempre visible */}
          {isAdmin && (
            <button onClick={() => { setActive('admin'); setMobileNavOpen(false); }}
                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm mb-3 transition relative ${active === 'admin' ? 'pt-shine' : ''}`}
                    style={{
                      background: active === 'admin' ? 'rgba(79,195,247,0.08)' : 'rgba(79,195,247,0.03)',
                      color: active === 'admin' ? C.cyan : C.textMuted,
                      border: `1px solid ${active === 'admin' ? 'rgba(79,195,247,0.35)' : 'rgba(79,195,247,0.15)'}`
                    }}>
              <Database size={15} />
              <span className="text-xs">Base de datos</span>
              {active === 'admin'
                ? <span className="absolute right-3 w-1.5 h-1.5 rounded-full" style={{ background: C.cyan, boxShadow: `0 0 8px ${C.cyan}` }}></span>
                : <span className="absolute right-3 text-[9px] uppercase tracking-wider" style={{ color: 'rgba(79,195,247,0.5)' }}>ADMIN</span>
              }
            </button>
          )}
          <div className="px-3 py-2 mb-2">
            <div className="text-[10px] uppercase tracking-wider" style={{ color: C.textDim }}>Admin</div>
            <div className="text-xs truncate" style={{ color: C.textMuted }}>{ADMIN_EMAIL}</div>
            {db && (
              <div className="flex items-center gap-1 mt-1">
                <span className="w-1.5 h-1.5 rounded-full" style={{ background: C.success }}></span>
                <span className="text-[9px] uppercase tracking-wider" style={{ color: C.success }}>SQL activo</span>
              </div>
            )}
            {dbError && (
              <div className="flex items-center gap-1 mt-1">
                <span className="w-1.5 h-1.5 rounded-full" style={{ background: C.warning }}></span>
                <span className="text-[9px] uppercase tracking-wider" style={{ color: C.warning }}>Modo local</span>
              </div>
            )}
          </div>
          <button onClick={onLogout}
                  className="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-xs uppercase tracking-wider transition"
                  style={{ color: C.textMuted, border: `1px solid ${C.border}` }}>
            <LogOut size={14} />
            Cerrar sesión
          </button>
          <p className="text-center text-[9px] mt-3 pt-display tracking-[0.25em]" style={{ color: C.textDim }}>
            PERSEVERA PARA TRIUNFAR
          </p>
        </div>
      </aside>

      {/* Mobile nav backdrop */}
      {mobileNavOpen && (
        <div className="fixed inset-0 bg-black/50 z-30 lg:hidden" onClick={() => setMobileNavOpen(false)}></div>
      )}

      {/* Main content */}
      <main className="flex-1 lg:ml-0 min-h-screen pt-scroll overflow-x-hidden">
        <div className="lg:hidden sticky top-0 z-20 px-4 py-3 flex items-center justify-between"
             style={{ background: C.bg, borderBottom: `1px solid ${C.border}` }}>
          <button onClick={() => setMobileNavOpen(true)}
                  className="px-3 py-1.5 rounded-lg text-xs uppercase tracking-wider"
                  style={{ color: C.gold, border: `1px solid ${C.goldBorder}` }}>
            ≡ Menú
          </button>
          <span className="pt-display text-sm pt-grad-text">PROSPECT TEAM</span>
        </div>
        <div className="p-5 lg:p-8 max-w-[1500px]">
          {renderView()}
        </div>
      </main>
    </div>
  );
}

function App() {
  useGlobalStyles();
  const [authed, setAuthed] = useState(false);
  const [isAdmin, setIsAdmin] = useState(false);
  const [dbReady, setDbReady] = useState(false);

  // Inicializar BD antes de mostrar el login para que dbVerifyLogin funcione
  useEffect(() => {
    initDB()
      .then(() => setDbReady(true))
      .catch(e => { console.error('DB init en App:', e); setDbReady(true); });
  }, []);

  if (!dbReady) {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center pt-body" style={{ background: C.bg }}>
        <img src={LOGO_PT} alt="Prospect Team" className="w-16 h-16 object-contain mb-4"
             style={{ filter: 'drop-shadow(0 8px 24px rgba(212,162,76,0.35))' }} />
        <div className="pt-display tracking-[0.3em] text-sm mb-1" style={{ color: C.gold }}>PROSPECT TEAM</div>
        <div className="text-xs mt-2" style={{ color: C.textDim }}>Inicializando base de datos…</div>
      </div>
    );
  }

  if (!authed) return <LoginScreen onLogin={(admin) => { setIsAdmin(!!admin); setAuthed(true); }} />;
  return <MainApp onLogout={() => { setIsAdmin(false); setAuthed(false); }} isAdmin={isAdmin} />;
}
